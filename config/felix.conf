#
# 这个文件对左右两个半（felix_left / felix_right）都生效，只放"两边都要"的设置。
#   * 只有 central（左手）需要的东西 → boards/shields/felix/felix_left.conf
#   * 只有 peripheral（右手）特有的调整 → boards/shields/felix/felix_right.conf
# 这样分是因为 *_STUDIO_RPC 系列依赖 central 才有的 ZMK_STUDIO_RPC，
# 放在右手会编译失败（proto/zmk/custom.pb.h 不存在）。

# Enables RGB functionality (Uncomment lines below to enable.)
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

CONFIG_ZMK_DISPLAY=y
# ZMK 官方内置状态屏（图层 / 电量 / 输出 / 外设）；显示设备用
# boards/shields/felix/felix.dtsi 里板载的 i2c OLED 或官方 nice!view
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=5000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3000000

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=y

# ===========================================================================
# DYA Studio 支持 —— 左右手共同部分
# （模块清单见 config/west.yml；完整的左右手之分见 felix_left.conf / felix_right.conf）
# ===========================================================================

# --- 电池上报（两半都报，central 负责汇总，见 felix_left.conf）---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# --- 电池历史：上游目前默认关闭（建议用 zmk-battery-center），想要就打开 ---
# CONFIG_ZMK_BATTERY_HISTORY=y
# CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y

# --- 自定义设置 + 分体 relay：让 peripheral 的设置也能被 DYA Studio 改 ---
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
